- file: lbj.html
  title: "LBJ and Nixon: Compare Judicial Confirmation Process"
  description: LBJ and Nixon turned Supreme Court confirmations into partisan battles, using ideological nominations, Senate resistance, and strategic tactics to shape the Court and influence modern confirmation politics.

- file: privacy_urlshortening.html
  title: Exploitation of URL Shorteners in Mobile Phishing Attacks
  description: URL shorteners enable mobile phishing by hiding malicious destinations. The analysis emphasizes the need for transparent links, stronger platform accountability, coordinated regulation, and proactive systemic safeguards to protect users in digital environments.

- file: ihl.html
  title: Are We Better Off Without the IHL in Securing the Right to Life?
  description: This essay examines the role of International Humanitarian Law (IHL) in safeguarding human life during armed conflict. It argues that IHL complements human rights law by addressing specific challenges of war, such as minimizing civilian harm and establishing ethical boundaries for military action.

- file: reflections.html
  title: Personal Reflections from Lessons in Leadership
  description: True leadership grows through authenticity, empathy, and courage, overcoming self-doubt and systemic barriers while empowering others and building inclusive communities where no one is excluded.

- file: humanrights.html
  title: The Universality of Human Rights
  description: Universal human rights are not inherently an imposition of Western values. UDHR’s diverse origins and cultural adaptability support its universal relevance. Despite Western influence and political misuse, UDHR remains a vital framework for protecting human dignity, warranting reform rather than rejection.

- file: upr.html
  title: Universal Periodic Review - A Critical Analysis of India's Fourth Cycle
  description: India’s human rights review shows the UPR promotes dialogue and incremental progress, but sovereignty, political interests, and weak enforcement limit its capacity for transformative change.

- file: sentencing.html
  title: Ethical Decision Making in Criminal Sentencing
  description: COMPAS sentencing algorithms raise concerns about racial bias, transparency, and fairness, prompting calls for audits, explainable systems, improved data, and oversight to protect vulnerable defendants.

- file: reform.html
  title: A Comprehensive Reform Strategy to Reduce Police Use of Force
  description: This essay proposes reducing systemic police violence through smarter dispatch, enhanced body cameras, and continuous accountability, while acknowledging significant financial, ethical, and organizational implementation barriers.

- file: interpretation.html
  title: Apocalypse and Interpretation
  description: This essay contrasts Job’s acceptance of divine mystery with Lauren Olamina’s pragmatic, adaptive faith in Octavia Butler’s Parable of the Sower, exploring how apocalyptic contexts reshape beliefs, authority structures, and survival strategies.

- file: wwf.html
  title: WWF and Biodiversity Protection
  description: WWF shapes biodiversity certification as both standard-setter and gatekeeper, promoting conservation while facing criticism over greenwashing, concentrated power, corporate influence, and inequities affecting developing nations.

- file: copenhagen.html
  title: "Team Report: Effects of Bicycle Infrastructure on Copenhagen's Air Quality"
  description: Copenhagen’s cycling infrastructure correlates with declining nitrogen dioxide levels, suggesting environmental and health benefits, although limited historical data and confounding factors complicate establishing definitive causation.

- file: fairness.html
  title: Statistical Definition of Fairness in Mortgage Lending Decisions
  description: This essay examines independence, sufficiency, and separation in mortgage algorithms, prioritizing separation while emphasizing transparency, accountability, privacy, and oversight beyond statistical measures of lending fairness.
